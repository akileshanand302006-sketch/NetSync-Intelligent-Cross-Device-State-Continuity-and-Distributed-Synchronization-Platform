<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#090d16"/>
  <circle cx="16" cy="16" r="14" stroke="#1e293b" stroke-width="1"/>
  <!-- Mesh lines -->
  <line x1="8" y1="16" x2="16" y2="8" stroke="url(#grad)" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="16" y1="8" x2="24" y2="16" stroke="url(#grad)" stroke-width="1.5"/>
  <line x1="24" y1="16" x2="16" y2="24" stroke="url(#grad)" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="16" y1="24" x2="8" y2="16" stroke="url(#grad)" stroke-width="1.5"/>
  <line x1="8" y1="16" x2="24" y2="16" stroke="url(#grad)" stroke-width="1.5"/>
  <!-- Nodes -->
  <circle cx="16" cy="8" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="24" cy="16" r="3" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="16" cy="24" r="3" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="8" cy="16" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="2.5" fill="#ffffff" filter="url(#glow)"/>
</svg>