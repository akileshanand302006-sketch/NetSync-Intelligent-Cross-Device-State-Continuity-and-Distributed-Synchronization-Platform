<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NetSync State Continuity</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131c36;
      --accent: #38bdf8;
      --emerald: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      display: inline-block;
      box-shadow: 0 0 8px var(--emerald);
    }
    .status-badge {
      font-size: 0.7rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .tab-info {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .tab-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .tab-url {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .scroll-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .scroll-val {
      color: var(--accent);
      font-weight: 600;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.825rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-beam {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
    }
    .btn-beam:hover {
      filter: brightness(1.1);
    }
    .btn-clip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
    .btn-clip:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .device-select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 0.8rem;
      margin-bottom: 12px;
      outline: none;
    }
    .feedback {
      text-align: center;
      font-size: 0.75rem;
      color: #34d399;
      font-weight: 600;
      margin-top: 6px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="status-dot"></span> NetSync
    </div>
    <span class="status-badge" id="status-badge">Mesh Connected</span>
  </div>

  <div class="tab-info">
    <div class="tab-title" id="tab-title">Loading active tab...</div>
    <div class="tab-url" id="tab-url">...</div>
    <div class="scroll-row">
      <span>Scroll Position:</span>
      <span class="scroll-val" id="scroll-val">0%</span>
    </div>
  </div>

  <label style="font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 4px;">Target Device:</label>
  <select class="device-select" id="target-device">
    <option value="dev-3">Google Pixel 9 Pro (Mobile)</option>
    <option value="dev-2">MacBook Pro M3 (Laptop)</option>
    <option value="dev-4">iPad Pro 13" (Tablet)</option>
  </select>

  <button class="btn btn-beam" id="btn-beam">
    ⚡ Beam Tab to Device
  </button>

  <button class="btn btn-clip" id="btn-clip">
    📋 Sync Page to Clipboard
  </button>

  <div class="feedback" id="feedback"></div>

  <script src="popup.js"></script>
</body>
</html>
