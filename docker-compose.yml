version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: netsync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netsync_user
      POSTGRES_PASSWORD: netsync_secure_password_2026
      POSTGRES_DB: netsync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsync_user -d netsync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netsync_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: netsync_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://netsync_user:netsync_secure_password_2026@db:5432/netsync_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=netsync-distributed-super-secret-production-key-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
    container_name: netsync_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
